version: "3"
virtualbrowsers:
- name: launchdarkly
  url: https://i3vcudz5ncoet6xkoaqxnos7mu0sdcpz.lambda-url.us-east-2.on.aws/?sandboxId=${_SANDBOX_ID}
virtualmachines:
- name: workstation
  # Single shared image for all three CodeControl tracks. Baked by the
  # operator from vm-image/ inputs and registered with Instruqt under
  # this name (see vm-image/README.md).
  image: launchdarkly/workshop-codecontrol
  shell: /bin/bash
  machine_type: n1-standard-1
secrets:
- name: LAUNCHDARKLY_ACCESS_TOKEN
