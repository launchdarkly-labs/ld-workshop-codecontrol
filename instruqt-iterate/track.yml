title: 'LaunchDarkly CodeControl: Iterate'
teaser: Stop guessing which version is better. Measure it with experiments, then let
  a bandit pick the winner.
description: |-
  ToggleWear's "Recommended for You" carousel works, and there are two ways
  to fill it: the safe Bestsellers strategy and the shiny Personalized one.
  Which is actually better? In this track you'll create an engagement
  metric and wire its events into the app, design an A/B experiment between
  the two strategies, run it against live shop traffic, read the results,
  promote the winner, and then hand the decision to a multi-armed bandit
  that routes traffic to whichever strategy is winning. You'll leave
  knowing how to let real data drive product decisions.
