title: 'LaunchDarkly CodeControl: Release'
teaser: Feature-flag fundamentals through a guarded release with automatic rollback.
description: |-
  ToggleWear is live, and you're the developer on the hook for shipping
  changes without breaking it. In this track you'll take Otto, a new chat
  widget, from an idea to a fully released feature: create your first flag,
  wire the LaunchDarkly SDKs into the app, target beta users, build a
  segment, ramp Otto out progressively, and finally ship a guarded release
  that rolls itself back when a bad variation degrades a real metric. You'll
  leave knowing how to release anything without holding your breath.
